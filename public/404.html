<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WhereInLabs</title>
    <script type="text/javascript">
      // SPA redirect logic for custom domains on GH Pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + l.pathname.replace(/^\/|\/$/g, "") +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
