name: Sync External News

on:
  schedule:
    - cron: '0 */6 * * *' # Roda a cada 6 horas
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and Aggregate News
        run: |
          mkdir -p public/data
          # Instalamos rss-to-json temporariamente para o script
          npm install rss-to-json
          node scripts/sync-news.js

      - name: Commit and Push
        run: |
          git config --global user.name 'WhereinNews Bot'
          git config --global user.email 'bot@whereingames.com'
          git add public/data/*.json
          git commit -m "chore: sync external news [skip ci]" || echo "No news updates"
          git push
